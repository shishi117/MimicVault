<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MimicVault</title>
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/toolbar.css">
  <link rel="stylesheet" href="css/states.css">
  <link rel="stylesheet" href="css/list.css">
  <link rel="stylesheet" href="css/hls.css">
  <link rel="stylesheet" href="css/downloadButton.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/live.css">
  <link rel="stylesheet" href="css/dash.css">
  <link rel="stylesheet" href="css/chip.css">
  <link rel="stylesheet" href="css/companion.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/bookmarks.css">
</head>
<body>

  <!-- ヘッダー -->
  <header class="header">
    <span class="header-icon">🧰</span>
    <span class="header-title">MimicVault</span>
    <!-- companion 接続インジケータ（ステップ15）-->
    <button id="companion-indicator"
            class="companion-indicator companion-disconnected"
            title="Companion未接続 — クリックして再接続"
            aria-label="FFmpeg companion 接続状態">⚡</button>
    <!-- ブックマーク一括DLパネルの開閉 -->
    <button id="bookmark-btn"
            class="settings-btn"
            title="ブックマーク一括ダウンロード"
            aria-label="ブックマーク一括ダウンロード">🔖</button>
    <!-- 設定ページへのリンク（ステップ18）-->
    <button id="settings-btn"
            class="settings-btn"
            title="設定を開く"
            aria-label="設定を開く">⚙</button>
    <!-- パネルを閉じる（ページに重ねて表示する固定幅パネル用） -->
    <button id="close-panel-btn"
            class="settings-btn"
            title="パネルを閉じる"
            aria-label="パネルを閉じる">✕</button>
  </header>

  <!-- ブックマーク一括ダウンロードパネル（メディアリストと排他表示） -->
  <section id="bookmark-panel" class="bookmark-panel hidden">
    <div class="bookmark-row">
      <select id="bookmark-folder" class="sort-select" aria-label="フォルダを選択"></select>
    </div>
    <div class="bookmark-row">
      <label class="bookmark-selall">
        <input type="checkbox" id="bookmark-selall"> すべて選択
      </label>
      <button id="bookmark-dl-btn" class="dl-all-btn">選択をDL</button>
    </div>
    <ul id="bookmark-list" class="bookmark-list"></ul>
    <p id="bookmark-empty" class="state-hint">このフォルダにブックマークはありません</p>
  </section>

  <!-- ライブ録画バナー（録画中セッションが存在する場合に表示） -->
  <div id="live-banner" class="live-banner hidden"></div>

  <!-- ツールバー: フィルタタブ + ソート -->
  <div id="toolbar" class="toolbar hidden">
    <div class="filter-tabs" role="tablist">
      <button class="filter-tab active" data-filter="all"   role="tab">すべて</button>
      <button class="filter-tab"        data-filter="video" role="tab">動画</button>
      <button class="filter-tab"        data-filter="audio" role="tab">音声</button>
    </div>
    <select id="sort-select" class="sort-select" aria-label="並び順">
      <option value="time">新しい順</option>
      <option value="size">サイズ大きい順</option>
      <option value="domain">ドメイン順</option>
    </select>
  </div>

  <!-- 空状態 -->
  <div id="state-empty" class="state-message">
    <div class="state-icon">◯</div>
    <p>このページでは動画が検出されませんでした</p>
    <p class="state-hint">動画を再生してから開き直してください</p>
  </div>

  <!-- フィルタ後に0件 -->
  <div id="state-no-match" class="state-message hidden">
    <div class="state-icon">◯</div>
    <p>該当するメディアがありません</p>
  </div>

  <!-- 検出済みリスト -->
  <ul id="media-list" class="media-list hidden"></ul>

  <!-- フッター -->
  <footer class="footer">
    <span id="count-label">0 件検出</span>
    <button id="clear-btn" class="clear-btn hidden">クリア</button>
  </footer>

  <script src="js/state.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/companionIndicator.js"></script>
  <script src="js/mediaType.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/renderList.js"></script>
  <script src="js/buildItem.js"></script>
  <script src="js/thumbnails.js"></script>
  <script src="js/hlsAccordion.js"></script>
  <script src="js/hlsDownload.js"></script>
  <script src="js/dashAccordion.js"></script>
  <script src="js/dashDownload.js"></script>
  <script src="js/dashMux.js"></script>
  <script src="js/liveBanner.js"></script>
  <script src="js/downloadButton.js"></script>
  <script src="js/segmentGroupDownload.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/bookmarks.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
